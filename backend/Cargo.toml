[package]
name = "enterprise-ledger"
version = "0.2.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "0f5bf03e13a43b34c43b9e3a6dee935ad43f6d2b", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rust_decimal = { version = "1", features = ["serde-str"] }
rust_xlsxwriter = "0.94"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23.0"
csv = "1"
url = "2.5.8"
flate2 = "1.1.9"

[dev-dependencies]
zip = { version = "6", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
